name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          python3 scripts/build-projects.py
          mkdir -p _site/assets/images
          cp index.html robots.txt sitemap.xml _site/
          cp -R projects _site/
          cp -R assets/css assets/js assets/fonts assets/icons _site/assets/
          cp assets/images/salman-portrait.webp assets/images/Salman_CV.pdf assets/images/favicon.svg assets/images/social-preview.png _site/assets/images/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
